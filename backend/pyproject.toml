[project]
name = "multi-agent-rag-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.2",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mcp>=1.2,<2",
    "ddgs>=9.0",
    "pyjwt[crypto]>=2.8",
    "python-docx>=1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
